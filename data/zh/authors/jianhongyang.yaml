bio: "杨建宏（Jianhong Yang），目前在[宁波东方理工大学](https://www.eitech.edu.cn/en)与[中国科学技术大学](https://www.ustc.edu.cn)联合培养博士项目攻读博士学位，由[赵一帆教授](https://faculty.eitech.edu.cn/engineering/zyf_en/main.htm)指导。在此之前，他于山东大学控制工程专业获得硕士学位，并在[视觉感知与智能系统实验室（VSISLab）](http://www.vsislab.com)开展研究，导师为[张伟教授](https://brain.sdu.edu.cn/info/1092/1093.htm)和[贾潇教授](https://faculty.sdu.edu.cn/jiaxiao/zh_CN/index.htm)。本科就读于山东科技大学机器人工程专业，并获得工学学士学位。"
